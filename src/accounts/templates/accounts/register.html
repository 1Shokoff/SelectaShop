{% extends "base.html" %}
{% block title %}Регистрация — SelectaShop{% endblock %}
{% block content %}
    <h1 class="title">Регистрация</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "accounts/_form.html" %}
        <button type="submit" class="button">Зарегистрироваться</button>
    </form>
    <p class="note">Уже есть учётная запись? <a href="{% url 'accounts:login' %}">Войти</a></p>
{% endblock %}
