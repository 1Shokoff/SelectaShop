{% if form.non_field_errors %}
    <div class="alert alert-error" role="alert">
        {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
    </div>
{% endif %}

{% for field in form %}
    <div class="field{% if field.errors %} field-invalid{% endif %}">
        <label for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
