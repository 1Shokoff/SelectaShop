# =============================================================================
#  SelectaShop — этап 0: nginx + Django
# =============================================================================
#  Переменные берутся из deploy/generated/.env, который порождается из
#  config/selectashop.toml. Запускать через make, а не напрямую:
#  compose нужно передать --env-file, иначе переменные не подставятся.
#
#  Оверлеи, подключаемые автоматически (см. Makefile):
#    deploy/generated/docker-compose.tls.yml     при [tls].enabled
#    deploy/generated/docker-compose.egress.yml  при [network].web_egress
# =============================================================================

# Общие настройки безопасности контейнеров.
x-hardening: &hardening
  # Процесс не может получить привилегии больше стартовых, даже через
  # setuid-бинарники. Отсекает целый класс приёмов повышения прав.
  security_opt:
    - no-new-privileges:true
  # Ни одной linux-capability. Оба сервиса слушают порты выше 1024
  # и работают от непривилегированного пользователя, так что не нужны.
  cap_drop:
    - ALL
  # Корневая файловая система только для чтения. Даже при выполнении
  # произвольного кода атакующему некуда положить полезную нагрузку:
  # записываемы только явно перечисленные tmpfs и тома.
  read_only: true
  restart: unless-stopped
  # Ограничение логов. На VPS с маленьким диском неограниченный json-лог
  # переполняет раздел и роняет всё разом.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ---------------------------------------------------------------------------
  #  Приложение
  # ---------------------------------------------------------------------------
  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    image: ${COMPOSE_PROJECT_NAME}-web:latest

    # Портов наружу нет вовсе. Приложение достижимо только из сети
    # internal, то есть только через nginx.
    expose:
      - "8000"

    networks:
      - internal
      - data

    volumes:
      # Единственный источник конфигурации, только для чтения.
      - ./config/selectashop.toml:/etc/selectashop/selectashop.toml:ro
      # Корневой сертификат БД. Нужен для режима verify-full: без него
      # приложение не смогло бы отличить настоящий сервер от подставного.
      - ./deploy/generated/certs/db/server.crt:/etc/postgresql/certs/server.crt:ro
      - static_data:/var/www/static
      - media_data:/var/www/media

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMPFS_SIZE}

    mem_limit: ${WEB_MEMORY}
    cpus: ${WEB_CPUS}
    pids_limit: ${WEB_PIDS}

    ulimits:
      nofile:
        soft: 2048
        hard: 4096

    # Миграции выполняются в entrypoint, поэтому база должна быть готова
    # принимать соединения, а не просто запущена.
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  База данных
  # ---------------------------------------------------------------------------
  db:
    <<: *hardening
    image: ${POSTGRES_IMAGE}

    # Контейнер работает от пользователя postgres с самого начала, а не
    # стартует от root и понижает права. Это обязательно, потому что
    # cap_drop: ALL отбирает CAP_SETUID и CAP_CHOWN — понизить права
    # процесс уже не смог бы. Образ рассчитан на такой запуск.
    user: "999:999"

    # Порт наружу не публикуется вовсе. База достижима только из сети
    # data, где находятся приложение и будущий воркер рассылки.
    expose:
      - "5432"

    networks:
      - data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      # Пароли ролей читает скрипт первичной инициализации.
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_BACKUP_USER: ${DB_BACKUP_USER}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипт создания ролей. Выполняется один раз, при первом запуске.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/generated/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./deploy/generated/certs/db:/etc/postgresql/certs:ro

    command:
      - postgres
      # Свои правила доступа вместо тех, что создаёт initdb.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # Шифрование канала до приложения.
      - -c
      - ssl=${PG_SSL}
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
      # Параметры под 1 ГБ RAM.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - work_mem=${PG_WORK_MEM}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION}

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMPFS_SIZE}
      # Каталог сокета. Корневая ФС смонтирована только для чтения,
      # а сокет создавать где-то надо.
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,mode=1777

    mem_limit: ${DB_MEMORY}
    cpus: ${DB_CPUS}
    pids_limit: ${DB_PIDS}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h /var/run/postgresql"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Воркер рассылки
  # ---------------------------------------------------------------------------
  worker:
    <<: *hardening

    # Тот же образ, что и web. Отличается только команда запуска: собирать
    # и обновлять второй образ ради одного процесса незачем.
    image: ${COMPOSE_PROJECT_NAME}-web:latest
    command: ["worker"]

    # ЕДИНСТВЕННЫЙ контейнер проекта с выходом в интернет. Контейнер web
    # остаётся полностью изолированным — это прямое следствие того, что
    # очередь лежит в базе, а не во внешнем брокере.
    #
    # Оборотная сторона, которую стоит держать в голове: здесь сходятся
    # вместе ключ шифрования (нужен, чтобы прочитать адрес получателя) и
    # доступ наружу. Компрометация этого контейнера опаснее, чем web.
    # Смягчается тем, что он не слушает ни одного порта вообще.
    networks:
      - data
      - egress

    volumes:
      - ./config/selectashop.toml:/etc/selectashop/selectashop.toml:ro
      - ./deploy/generated/certs/db/server.crt:/etc/postgresql/certs/server.crt:ro

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMPFS_SIZE}

    mem_limit: ${WORKER_MEMORY}
    cpus: ${WORKER_CPUS}
    pids_limit: ${WORKER_PIDS}

    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  Веб-сервер
  # ---------------------------------------------------------------------------
  nginx:
    <<: *hardening
    image: ${NGINX_IMAGE}

    # Образ nginx-unprivileged работает от uid 101 и слушает порт 8080.
    # Обычный образ nginx запускает мастер-процесс от root — здесь это
    # не нужно и не используется.
    ports:
      - "${BIND_ADDRESS}:${HTTP_PORT}:8080"

    networks:
      - edge
      - internal

    volumes:
      - ./deploy/generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/generated/snippets:/etc/nginx/snippets:ro
      # Статика и загруженные файлы — строго только для чтения.
      # Веб-сервер не имеет причин что-либо в них записывать.
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMPFS_SIZE}

    mem_limit: ${NGINX_MEMORY}
    cpus: ${NGINX_CPUS}
    pids_limit: ${NGINX_PIDS}

    ulimits:
      nofile:
        soft: 2048
        hard: 4096

    healthcheck:
      # Отдельный сервер на 127.0.0.1:8081 внутри контейнера.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # service_started, а не service_healthy: nginx должен подняться и
    # отдавать 502, даже если приложение сейчас нездорово. Иначе сбой
    # в Django означал бы полное отсутствие ответа от сервера.
    #
    # ВАЖНО: nginx резолвит имя web один раз при старте. Если пересоздать
    # только контейнер web, он получит новый IP, а nginx продолжит стучать
    # по старому. Поэтому перезапускать сервисы следует вместе:
    # `make restart`, а не `docker compose restart web`.
    depends_on:
      web:
        condition: service_started

networks:
  # Внешняя сеть: только nginx. Через неё приходит трафик с хоста.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET}

  # Внутренняя сеть: nginx <-> web.
  # internal: true означает, что docker не создаёт маршрут наружу.
  # Контейнер web не может инициировать соединение в интернет вообще —
  # это резко ограничивает ущерб от возможного RCE: ни выгрузить данные,
  # ни скачать вторую стадию нагрузки.
  # Снимается через [network].web_egress = true, когда понадобятся
  # платёжные API и SMTP.
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET}

  # Сеть данных: приложение <-> база. Отдельно от internal намеренно —
  # у nginx нет и не должно быть доступа к базе данных. Тоже изолирована
  # от интернета.
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${DATA_SUBNET}

  # Единственная сеть без пометки internal. В ней находится только воркер
  # рассылки: ему нужно достучаться до SMTP-релея. Ни web, ни db, ни nginx
  # к ней не подключены.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${EGRESS_SUBNET}

volumes:
  static_data:
  media_data:
  pgdata:
