# =============================================================================
#  SelectaShop — ЕДИНСТВЕННЫЙ файл конфигурации всего проекта
# =============================================================================
#
#  Этот файл — единственный источник правды. Из него берут настройки:
#    * Django          — читает этот файл напрямую (src/selectashop/settings.py)
#    * nginx           — конфиг генерируется из deploy/nginx/nginx.conf.template
#    * docker compose  — переменные генерируются в deploy/generated/.env
#
#  После ЛЮБОЙ правки этого файла выполните:   make config && make up
#
#  ВНИМАНИЕ: рабочая копия config/selectashop.toml содержит секреты и
#  намеренно добавлена в .gitignore. Коммитится только этот .example файл.
# =============================================================================


# -----------------------------------------------------------------------------
# [project] — общие параметры сборки и запуска
# -----------------------------------------------------------------------------
[project]
name = "selectashop"

# Префикс реестра образов. Пусто = Docker Hub.
# Docker Hub недоступен с российских IP-адресов. Если сборка на VPS падает
# на этапе pull, укажите здесь зеркало, например:
#   image_registry = "dockerhub.timeweb.cloud/"
#   image_registry = "cr.yandex/mirror/"
# Косая черта в конце ОБЯЗАТЕЛЬНА.
image_registry = ""

# Базовые образы. Меняйте версии осознанно: обновление патч-версии закрывает
# CVE, обновление минорной может сломать конфиг.
nginx_image = "nginxinc/nginx-unprivileged:1.27-alpine"
python_image = "python:3.12-slim-bookworm"
postgres_image = "postgres:16-bookworm"


# -----------------------------------------------------------------------------
# [network] — адреса, порты, docker-сети
# -----------------------------------------------------------------------------
[network]
# Публичный IP вашего VPS. Попадает и в Django ALLOWED_HOSTS, и в nginx
# server_name. Запросы с чужим заголовком Host будут отброшены (см. docs).
server_ip = "203.0.113.10"

# Дополнительные разрешённые хосты (домен, когда появится).
# Пример: extra_allowed_hosts = ["shop.example.com", "www.shop.example.com"]
extra_allowed_hosts = []

# Порты, публикуемые НА ХОСТЕ. Это единственные порты проекта, видимые извне.
http_port = 80
https_port = 443

# Слушать только на этом адресе хоста. "0.0.0.0" — все интерфейсы.
# Можно сузить до конкретного IP, если на сервере несколько интерфейсов.
bind_address = "0.0.0.0"

# Подсети docker-сетей. Меняйте, только если пересекаются с вашей сетью.
#   edge      — nginx <-> внешний мир
#   internal  — nginx <-> web. Изолирована: НЕТ доступа в интернет и из него.
#   data      — web <-> db. Тоже изолирована. Отдельно от internal намеренно:
#               nginx не должен иметь доступа к базе данных никогда.
edge_subnet = "172.28.10.0/24"
internal_subnet = "172.28.20.0/24"
data_subnet = "172.28.30.0/24"

# Сеть с выходом в интернет. В ней находится ТОЛЬКО воркер рассылки:
# он единственный, кому нужно обращаться наружу (к SMTP-релею).
egress_subnet = "172.28.40.0/24"

# Базовый адрес сайта. Используется для ссылок в письмах.
# Пусто = собирается автоматически из server_ip, портов и [tls].enabled.
# Когда появится домен, впишите его сюда: "https://shop.example.ru"
public_base_url = ""

# Разрешить контейнеру web исходящие соединения в интернет.
# false = внутренняя сеть помечена internal, web физически не может никуда
# подключиться. Это резко снижает ущерб от RCE. Понадобится true на этапе
# платежей (запросы к API агрегатора) и почты (SMTP-релей).
web_egress = false


# -----------------------------------------------------------------------------
# [tls] — шифрование канала
# -----------------------------------------------------------------------------
# TLS ОБЯЗАТЕЛЕН с тех пор, как на сайте появилась форма входа. Без него
# логин и пароль идут по сети открытым текстом, а cookie сеанса
# перехватывается любым узлом на маршруте.
#
# Генерация конфигурации ОТКАЗЫВАЕТ при enabled = false, если настроена
# база данных: раз есть база — есть и учётные записи, а значит есть что
# перехватывать. Это не перестраховка, а единственный способ не забыть.
#
# Домен для этого не нужен:
#   make tls-selfsigned      # самоподписанный сертификат на IP-адрес
#
# Браузер покажет предупреждение — доверенного центра сертификации за
# таким сертификатом нет, — но трафик будет зашифрован. Когда появится
# домен, переключитесь на Let's Encrypt, и предупреждение исчезнет.
[tls]
enabled = true

# Пути ВНУТРИ контейнера nginx (монтируются из ./deploy/generated/certs).
cert_file = "/etc/nginx/certs/server.crt"
key_file = "/etc/nginx/certs/server.key"

# Редирект http -> https. Включается только вместе с enabled = true.
redirect_http = true

# HSTS. Держите 0, пока сертификат самоподписанный: браузер запомнит
# требование HTTPS и вы не сможете откатиться на HTTP без чистки состояния.
# Рабочее значение после перехода на доверенный сертификат: 31536000.
hsts_seconds = 0
hsts_include_subdomains = false
hsts_preload = false


# -----------------------------------------------------------------------------
# [django] — настройки приложения
# -----------------------------------------------------------------------------
[django]
# ОБЯЗАТЕЛЬНО заполнить. Сгенерировать: make secret
# Приложение не стартует с пустым или коротким ключом — это сделано намеренно.
secret_key = ""

# Никогда не включайте на сервере, доступном из интернета: DEBUG отдаёт
# трассировки со значениями переменных, включая пароли БД.
debug = false

time_zone = "Asia/Magadan"
language_code = "ru-ru"

# Уровень логирования: DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# Админка Django. На этапе 0 выключена: пустой сайт не нуждается в ней,
# а включённая админка — это форма входа, которую будут перебирать боты.
# Включим на этапе 1 вместе с TLS и rate-limit.
admin_enabled = false

# URL админки. НЕ оставляйте "admin/" — смените на неугадываемый путь.
# Это не защита сама по себе, но отсекает весь шумовой перебор ботами.
admin_url = "sa-console-CHANGE-ME/"

# Лимиты на размер запроса (защита от DoS через раздувание тела запроса).
data_upload_max_memory_size = 2621440   # 2.5 MiB
data_upload_max_number_fields = 1000
file_upload_max_memory_size = 2621440   # 2.5 MiB


# -----------------------------------------------------------------------------
# [database] — база данных
# -----------------------------------------------------------------------------
[database]
engine = "postgresql"    # none | sqlite | postgresql    # none | sqlite | postgresql
name = "selectashop"
host = "db"
port = 5432

# --- Роли БД ---
# Разделение ролей — не формальность. У приложения нет прав DDL, поэтому
# успешная SQL-инъекция не сможет выполнить DROP TABLE или создать функцию.
#
#   app    — только SELECT/INSERT/UPDATE/DELETE. Используется приложением.
#   owner  — владелец схемы, права DDL. Используется ТОЛЬКО миграциями.
#   backup — только чтение. Для резервного копирования.
#   super  — суперпользователь кластера. Только ручное обслуживание.
#
# Все пароли генерируются командой `make init-config`.
app_user = "selectashop_app"
app_password = ""
owner_user = "selectashop_owner"
owner_password = ""
backup_user = "selectashop_backup"
backup_password = ""
superuser = "postgres"
superuser_password = ""

conn_max_age = 60        # секунд; переиспользование соединений

# Шифрование канала между приложением и БД.
# verify-full — самый строгий режим: проверяется и цепочка сертификата,
# и совпадение имени хоста. Сертификат создаётся командой `make db-cert`.
# Если понадобится отключить: "disable" (и tls_enabled = false ниже).
ssl_mode = "verify-full"
ssl_root_cert = "/etc/postgresql/certs/server.crt"
tls_enabled = true


# -----------------------------------------------------------------------------
# [database.tuning] — параметры PostgreSQL под 1 GB RAM
# -----------------------------------------------------------------------------
# Значения подобраны так, чтобы БД занимала около 210 MB вместе с бэкендами
# и оставляла место странице кэша ОС. Увеличивать shared_buffers на этом
# железе вредно: память отнимется у файлового кэша, которым PostgreSQL
# пользуется не меньше.
[database.tuning]
shared_buffers = "128MB"
effective_cache_size = "256MB"
work_mem = "4MB"
maintenance_work_mem = "64MB"
wal_buffers = "4MB"

# 2 воркера gunicorn по 4 потока дают максимум 8 соединений, плюс воркер
# рассылки и запас на обслуживание.
max_connections = 20

checkpoint_completion_target = 0.9
random_page_cost = 1.1              # 1.1 — для SSD; для HDD ставьте 4.0

# Запрос, идущий дольше этого времени, прерывается. Защита от того, что
# один тяжёлый запрос займёт единственное ядро. Для роли owner таймаут
# снимается отдельно, иначе длинная миграция была бы убита на середине.
statement_timeout = "15s"

# Транзакция, брошенная открытой, удерживает соединение и блокировки.
idle_in_transaction_session_timeout = "30s"

log_min_duration_statement = 500    # мс; логировать медленные запросы


# -----------------------------------------------------------------------------
# [gunicorn] — WSGI-сервер приложения
# -----------------------------------------------------------------------------
# Расчёт под VPS 1 vCPU / 1 GB RAM.
# workers=2 + threads=4 даёт до 8 одновременных запросов при ~200 MB RSS.
# Больше воркеров на одном ядре не ускорят, а съедят память.
[gunicorn]
workers = 2
threads = 4
timeout = 30             # убить воркер, зависший дольше N секунд
graceful_timeout = 30
keepalive = 5

# Перезапуск воркера после N запросов — страховка от утечек памяти.
# Критично на 1 GB: медленная утечка иначе приводит к OOM-kill.
max_requests = 500
max_requests_jitter = 50

# Предзагрузка приложения до fork(): воркеры делят память через
# copy-on-write. На 1 GB экономит около 60-80 MB.
preload_app = true

# Лимит на строку запроса и заголовки (защита от переполнения).
limit_request_line = 4094
limit_request_fields = 100
limit_request_field_size = 8190


# -----------------------------------------------------------------------------
# [limits] — лимиты ресурсов контейнеров
# -----------------------------------------------------------------------------
# Без лимитов при всплеске памяти OOM-killer ядра выбирает жертву сам,
# и это может оказаться не тот процесс. Явные лимиты локализуют отказ.
[limits]
web_memory = "320m"
web_cpus = "0.75"
web_pids = 128

# PostgreSQL: 128 МБ разделяемых буферов плюс бэкенды и фоновые процессы.
db_memory = "320m"
db_cpus = "0.60"
db_pids = 128

# Воркер рассылки: тот же образ, что и web, но без веб-сервера.
worker_memory = "160m"
worker_cpus = "0.25"
worker_pids = 64

nginx_memory = "64m"
nginx_cpus = "0.35"
nginx_pids = 64

# Размер tmpfs для временных файлов (контейнеры запускаются с read-only FS).
tmpfs_size = "32m"


# -----------------------------------------------------------------------------
# [nginx] — веб-сервер и фронтовая защита
# -----------------------------------------------------------------------------
[nginx]
worker_processes = 1          # = числу ядер VPS
worker_connections = 512

# Лимит дескрипторов на воркер. Должен быть минимум вдвое больше
# worker_connections: на каждое клиентское соединение может приходиться
# второй дескриптор на соединение с приложением. Меньшее значение
# приводит к отказам EMFILE под нагрузкой.
# Согласовано с ulimits.nofile в docker-compose.yml.
worker_rlimit_nofile = 2048

keepalive_timeout = 15

# Запросов на одно keep-alive соединение. На одном ядре переустановка
# TCP-соединения обходится дороже, чем удержание открытого, поэтому
# держим штатное значение nginx, а не заниженное.
keepalive_requests = 1000

client_max_body_size = "8m"

# Таймауты. Прямая защита от Slowloris: клиент, который тянет отправку
# заголовков или тела, отключается через N секунд.
client_body_timeout = 10
client_header_timeout = 10
send_timeout = 10
resolver_timeout = 5

# Разрешённые HTTP-методы. Всё остальное отбрасывается на уровне nginx,
# не доходя до Python.
allowed_methods = ["GET", "HEAD", "POST"]

# --- Ограничение частоты запросов (rate limiting) ---
# Общая зона: обычный просмотр каталога.
rate_limit_general = "20r/s"
rate_limit_general_burst = 40

# Строгая зона для форм входа/регистрации. Это основная защита от
# перебора паролей. Активируется на этапе 1.
rate_limit_auth = "10r/m"
rate_limit_auth_burst = 5

# Зона для админки.
rate_limit_admin = "30r/m"
rate_limit_admin_burst = 10

# Одновременных соединений с одного IP.
conn_limit_per_ip = 20

# Размер разделяемой памяти под счётчики лимитов.
# 1 MB вмещает примерно 16000 адресов.
limit_zone_size = "2m"

# Кэширование статики браузером.
static_cache_max_age = "30d"

# Логи. Отключение лога healthcheck-ов экономит место на диске:
# на 1 GB VPS переполнение диска логами — реальный сценарий отказа.
log_healthcheck = false
access_log_enabled = true


# -----------------------------------------------------------------------------
# [security] — заголовки безопасности и политика браузера
# -----------------------------------------------------------------------------
[security]
# Content-Security-Policy. Строгая по умолчанию: ни один внешний скрипт
# или стиль не выполнится, даже если попадёт в HTML через XSS.
# При подключении CDN или внешних шрифтов придётся ослабить — делайте это
# точечно, не добавляйте 'unsafe-inline' целиком.
content_security_policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

referrer_policy = "same-origin"
permissions_policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
cross_origin_opener_policy = "same-origin"
cross_origin_resource_policy = "same-origin"
x_frame_options = "DENY"

# Доверенные источники для CSRF. Django сверяет заголовок Origin/Referer.
# Заполняется автоматически из network.server_ip и [tls], но при работе
# за внешним прокси может понадобиться указать вручную.
csrf_trusted_origins = []

# Cookie. SameSite=Lax блокирует отправку cookie при кросс-сайтовых
# переходах — базовая защита от CSRF в дополнение к токену Django.
session_cookie_samesite = "Lax"
csrf_cookie_samesite = "Lax"
session_cookie_age = 1209600     # 14 суток
session_expire_at_browser_close = false

# Скрывать точную версию nginx и Django в ответах.
hide_server_version = true

# -----------------------------------------------------------------------------
#  Криптографические ключи
# -----------------------------------------------------------------------------
#  Все три генерируются командой `make init-config` и НИКОГДА не должны
#  попадать в git. Потеря data_encryption_key означает потерю всех адресов
#  электронной почты без возможности восстановления.
#
#  Ключи разные намеренно: компрометация перца для поиска не должна давать
#  возможности расшифровать сами данные.

# AES-256-GCM для шифрования персональных данных. base64, 32 байта.
data_encryption_key = ""

# HMAC-SHA256 для слепого индекса — по нему ищется пользователь при входе.
# Позволяет искать по точному совпадению, не храня адрес открытым текстом.
blind_index_pepper = ""

# HMAC-SHA256 для хеширования токенов подтверждения и сброса пароля.
token_pepper = ""

# Версия ключа шифрования. Увеличивается при ротации; записи со старой
# версией перешифровываются постепенно, без остановки сервиса.
encryption_key_version = 1


# -----------------------------------------------------------------------------
# [accounts] — регистрация, вход, защита от злоупотреблений
# -----------------------------------------------------------------------------
[accounts]

# Сколько живёт неподтверждённая регистрация. По истечении адрес
# освобождается и может быть занят заново.
# Решает проблему захвата: иначе злоумышленник регистрируется на чужой
# адрес, не подтверждает его и навсегда блокирует владельцу регистрацию.
unverified_email_ttl_hours = 24

# Время жизни ссылок в письмах.
email_verify_token_ttl_hours = 24
password_reset_token_ttl_hours = 2

# --- Логины ---
# Уникальность регистронезависимая: IvanPetrov и ivanpetrov — один логин.
# Регистр ввода при этом сохраняется для отображения.
# Разрешены латиница, цифры и разделители _ - . ; должен начинаться с буквы,
# два разделителя подряд запрещены, на разделитель заканчиваться нельзя.
username_min_length = 4
username_max_length = 32

# Зарезервированные имена. Сверка идёт по «свёрнутому» виду, где похожие
# символы приведены к одному, поэтому заблокированы не только admin и ADMIN,
# но и adm1n, 4dmin, @dmin.
reserved_usernames = [
    "admin", "administrator", "root", "superuser", "sysadmin",
    "moderator", "support", "help", "helpdesk", "service",
    "security", "abuse", "postmaster", "webmaster", "hostmaster",
    "owner", "staff", "team", "official", "selectashop",
    "shop", "store", "system", "noreply", "no-reply",
    "billing", "payment", "payments", "order", "orders",
    "api", "www", "mail", "ftp", "test", "guest", "anonymous",
    "null", "undefined", "me", "you",
]

# --- Почтовые домены ---
# Одноразовые почтовые сервисы. Список заведомо неполон и полным быть не
# может — это фильтр от ленивого мультиаккаунтинга, а не защита.
# Дополняйте по мере необходимости.
blocked_email_domains = [
    "mailinator.com", "10minutemail.com", "guerrillamail.com",
    "tempmail.com", "temp-mail.org", "throwaway.email",
    "yopmail.com", "trashmail.com", "sharklasers.com",
    "getnada.com", "dropmail.me", "maildrop.cc",
]

# --- Пароли ---
# 10 символов против 8 по умолчанию в Django. Плюс валидаторы Django:
# похожесть на логин, распространённость, только цифры.
password_min_length = 10

# --- Защита от злоупотреблений ---
# Письма стоят денег и репутации отправителя. Без этих лимитов сайт
# превращается в бесплатный инструмент для заваливания чужого ящика.
# Три письма в час оказались слишком тесно: регистрация расходует одно,
# и пары запросов восстановления уже хватало, чтобы упереться в лимит.
# Пять сохраняет защиту и не мешает обычному пользователю.
max_emails_per_address_per_hour = 5
max_registrations_per_ip_per_hour = 5

# Блокировка после серии неудачных входов. Считается по учётной записи
# и по адресу отдельно.
max_login_failures = 10
login_lockout_minutes = 15

# IP-адрес — тоже персональные данные, хранить его бессрочно нельзя.
security_event_retention_days = 90


# -----------------------------------------------------------------------------
# [legal] — юридические документы
# -----------------------------------------------------------------------------
#  Тексты документов лежат файлами в каталоге legal/ и версионируются git.
#  В базе хранится только ключ, версия и SHA-256 текста на момент согласия.
#  Хеш важен: он доказывает согласие не с «версией 1.0» абстрактно, а
#  ровно с тем текстом, который пользователь видел.
#
#  При изменении документа поднимите версию здесь — у новых пользователей
#  согласие будет записано с новой версией, старые записи останутся как есть.
[legal]
documents_dir = "legal"
pdn_consent_version = "1.0"
terms_version = "1.0"


# -----------------------------------------------------------------------------
# [email] — отправка писем
# -----------------------------------------------------------------------------
[email]

# Способ доставки:
#
#   console — письмо целиком печатается в журнал воркера, включая ссылку
#             подтверждения. Ничего никуда не отправляется. Этот режим
#             позволяет пройти весь сценарий регистрации, не имея ни
#             домена, ни учётной записи у провайдера: `make logs`,
#             скопировать ссылку, открыть в браузере.
#
#   smtp    — настоящая отправка через релей.
#
# Собственный почтовый сервер не предусмотрен намеренно. С арендованного
# IP письма попадают в спам: у диапазонов хостеров плохая репутация, а
# записи SPF, DKIM и DMARC требуют домена, которого пока нет.
backend = "console"

# Адрес и имя отправителя. В режиме smtp адрес обязан совпадать с ящиком,
# от имени которого разрешено отправлять: релей чужой адрес не пропустит.
from_address = "noreply@example.com"
from_name = "SelectaShop"

# Адрес для ответов. Пусто = совпадает с from_address.
# Полезно указать настоящий ящик поддержки: письма уходят с noreply,
# но человек, нажавший «ответить», должен куда-то попасть.
reply_to = ""


# -----------------------------------------------------------------------------
# [email.smtp] — параметры релея (нужны только при backend = "smtp")
# -----------------------------------------------------------------------------
#  Пока домена нет, подойдёт личный ящик. Проверенные настройки:
#
#    Яндекс:  host = "smtp.yandex.ru",  port = 465, security = "ssl"
#    Mail.ru: host = "smtp.mail.ru",    port = 465, security = "ssl"
#    Gmail:   host = "smtp.gmail.com",  port = 587, security = "tls"
#
#  ВАЖНО: во всех трёх нужен НЕ пароль от почты, а отдельный пароль
#  приложения, который создаётся в настройках безопасности ящика.
#  Обычный пароль там не сработает, а если сработает — значит у вас
#  отключена двухфакторная защита, и это стоит исправить.
#
#  ВАЖНО-2: многие хостеры закрывают исходящий SMTP. Проверьте с сервера:
#    timeout 5 bash -c '</dev/tcp/smtp.yandex.ru/587' && echo открыт || echo закрыт
[email.smtp]
host = "smtp.yandex.ru"
port = 465

user = ""
password = ""

# ssl — шифрование с первого байта соединения (обычно порт 465)
# tls — STARTTLS поверх открытого соединения (обычно порт 587)
security = "ssl"

timeout = 20


# -----------------------------------------------------------------------------
# [worker] — воркер рассылки
# -----------------------------------------------------------------------------
#  Отдельный контейнер из того же образа, что и web. Единственный сервис
#  проекта, имеющий выход в интернет: контейнер web остаётся полностью
#  изолированным, и это прямое следствие того, что очередь лежит в БД,
#  а не во внешнем брокере.
[worker]

# Пауза между опросами, когда очередь пуста. Непустая обрабатывается
# без пауз. Три секунды на пустой очереди — это 28800 лёгких запросов
# в сутки, нагрузка неразличима.
poll_interval_seconds = 3

# Сколько сообщений забирать за раз.
batch_size = 10

# Повторы при ошибке отправки: задержка удваивается с каждой попыткой
# и получает случайный разброс, чтобы накопившиеся письма не ушли
# одновременно после восстановления связи.
retry_base_seconds = 60
retry_max_seconds = 3600

# Сколько ждать завершения текущей отправки при остановке контейнера.
shutdown_grace_seconds = 20

# Если воркер умрёт между отправкой письма и записью результата, строка
# останется в состоянии «отправляется» навсегда. По истечении этого срока
# такая строка возвращается в очередь. Значение должно быть заметно больше
# таймаута SMTP, иначе письмо уйдёт дважды из-за обычной медленной отправки.
stale_lock_seconds = 300
