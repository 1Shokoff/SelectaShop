# =============================================================================
#  SelectaShop — ЕДИНСТВЕННЫЙ файл конфигурации всего проекта
# =============================================================================
#
#  Этот файл — единственный источник правды. Из него берут настройки:
#    * Django          — читает этот файл напрямую (src/selectashop/settings.py)
#    * nginx           — конфиг генерируется из deploy/nginx/nginx.conf.template
#    * docker compose  — переменные генерируются в deploy/generated/.env
#
#  После ЛЮБОЙ правки этого файла выполните:   make config && make up
#
#  ВНИМАНИЕ: рабочая копия config/selectashop.toml содержит секреты и
#  намеренно добавлена в .gitignore. Коммитится только этот .example файл.
# =============================================================================


# -----------------------------------------------------------------------------
# [project] — общие параметры сборки и запуска
# -----------------------------------------------------------------------------
[project]
name = "selectashop"

# Префикс реестра образов. Пусто = Docker Hub.
# Docker Hub недоступен с российских IP-адресов. Если сборка на VPS падает
# на этапе pull, укажите здесь зеркало, например:
#   image_registry = "dockerhub.timeweb.cloud/"
#   image_registry = "cr.yandex/mirror/"
# Косая черта в конце ОБЯЗАТЕЛЬНА.
image_registry = ""

# Базовые образы. Меняйте версии осознанно: обновление патч-версии закрывает
# CVE, обновление минорной может сломать конфиг.
nginx_image = "nginxinc/nginx-unprivileged:1.27-alpine"
python_image = "python:3.12-slim-bookworm"


# -----------------------------------------------------------------------------
# [network] — адреса, порты, docker-сети
# -----------------------------------------------------------------------------
[network]
# Публичный IP вашего VPS. Попадает и в Django ALLOWED_HOSTS, и в nginx
# server_name. Запросы с чужим заголовком Host будут отброшены (см. docs).
server_ip = "203.0.113.10"

# Дополнительные разрешённые хосты (домен, когда появится).
# Пример: extra_allowed_hosts = ["shop.example.com", "www.shop.example.com"]
extra_allowed_hosts = []

# Порты, публикуемые НА ХОСТЕ. Это единственные порты проекта, видимые извне.
http_port = 80
https_port = 443

# Слушать только на этом адресе хоста. "0.0.0.0" — все интерфейсы.
# Можно сузить до конкретного IP, если на сервере несколько интерфейсов.
bind_address = "0.0.0.0"

# Подсети docker-сетей. Меняйте, только если пересекаются с вашей сетью.
#   edge      — nginx <-> внешний мир
#   internal  — nginx <-> web. Изолирована: НЕТ доступа в интернет и из него.
edge_subnet = "172.28.10.0/24"
internal_subnet = "172.28.20.0/24"

# Разрешить контейнеру web исходящие соединения в интернет.
# false = внутренняя сеть помечена internal, web физически не может никуда
# подключиться. Это резко снижает ущерб от RCE. Понадобится true на этапе
# платежей (запросы к API агрегатора) и почты (SMTP-релей).
web_egress = false


# -----------------------------------------------------------------------------
# [tls] — шифрование канала
# -----------------------------------------------------------------------------
# ВАЖНО. Сейчас enabled = false, потому что домена нет, а на этапе 0 сайт
# не передаёт ни паролей, ни cookie-сессий — защищать нечего.
#
# ПЕРЕД ЭТАПОМ 1 (регистрация и вход) TLS ОБЯЗАТЕЛЕН. Без него логин и
# пароль идут по сети открытым текстом, а session-cookie перехватывается
# любым узлом на маршруте. Домена для этого не требуется:
#   make tls-selfsigned      # самоподписанный сертификат на IP
# Браузер покажет предупреждение, но трафик будет зашифрован.
# Когда появится домен — переключитесь на Let's Encrypt.
[tls]
enabled = false

# Пути ВНУТРИ контейнера nginx (монтируются из ./deploy/generated/certs).
cert_file = "/etc/nginx/certs/server.crt"
key_file = "/etc/nginx/certs/server.key"

# Редирект http -> https. Включается только вместе с enabled = true.
redirect_http = true

# HSTS. Держите 0, пока сертификат самоподписанный: браузер запомнит
# требование HTTPS и вы не сможете откатиться на HTTP без чистки состояния.
# Рабочее значение после перехода на доверенный сертификат: 31536000.
hsts_seconds = 0
hsts_include_subdomains = false
hsts_preload = false


# -----------------------------------------------------------------------------
# [django] — настройки приложения
# -----------------------------------------------------------------------------
[django]
# ОБЯЗАТЕЛЬНО заполнить. Сгенерировать: make secret
# Приложение не стартует с пустым или коротким ключом — это сделано намеренно.
secret_key = ""

# Никогда не включайте на сервере, доступном из интернета: DEBUG отдаёт
# трассировки со значениями переменных, включая пароли БД.
debug = false

time_zone = "Asia/Magadan"
language_code = "ru-ru"

# Уровень логирования: DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# Админка Django. На этапе 0 выключена: пустой сайт не нуждается в ней,
# а включённая админка — это форма входа, которую будут перебирать боты.
# Включим на этапе 1 вместе с TLS и rate-limit.
admin_enabled = false

# URL админки. НЕ оставляйте "admin/" — смените на неугадываемый путь.
# Это не защита сама по себе, но отсекает весь шумовой перебор ботами.
admin_url = "sa-console-CHANGE-ME/"

# Лимиты на размер запроса (защита от DoS через раздувание тела запроса).
data_upload_max_memory_size = 2621440   # 2.5 MiB
data_upload_max_number_fields = 1000
file_upload_max_memory_size = 2621440   # 2.5 MiB


# -----------------------------------------------------------------------------
# [database] — база данных
# -----------------------------------------------------------------------------
# На этапе 0 контейнера БД ещё нет, поэтому engine = "none":
# Django стартует вообще без подключения к базе. Это минимальная
# поверхность атаки для пустого сайта.
#
# На этапе 1 переключим на "postgresql" и добавим контейнер db.
# Значение "sqlite" оставлено для локальной отладки и НЕ предназначено
# для продакшена.
[database]
engine = "none"          # none | sqlite | postgresql
name = "selectashop"
host = "db"
port = 5432
user = "selectashop"
password = ""
conn_max_age = 60        # секунд; переиспользование соединений
ssl_mode = "prefer"      # для postgresql: disable|prefer|require|verify-full


# -----------------------------------------------------------------------------
# [gunicorn] — WSGI-сервер приложения
# -----------------------------------------------------------------------------
# Расчёт под VPS 1 vCPU / 1 GB RAM.
# workers=2 + threads=4 даёт до 8 одновременных запросов при ~200 MB RSS.
# Больше воркеров на одном ядре не ускорят, а съедят память.
[gunicorn]
workers = 2
threads = 4
timeout = 30             # убить воркер, зависший дольше N секунд
graceful_timeout = 30
keepalive = 5

# Перезапуск воркера после N запросов — страховка от утечек памяти.
# Критично на 1 GB: медленная утечка иначе приводит к OOM-kill.
max_requests = 500
max_requests_jitter = 50

# Предзагрузка приложения до fork(): воркеры делят память через
# copy-on-write. На 1 GB экономит около 60-80 MB.
preload_app = true

# Лимит на строку запроса и заголовки (защита от переполнения).
limit_request_line = 4094
limit_request_fields = 100
limit_request_field_size = 8190


# -----------------------------------------------------------------------------
# [limits] — лимиты ресурсов контейнеров
# -----------------------------------------------------------------------------
# Без лимитов при всплеске памяти OOM-killer ядра выбирает жертву сам,
# и это может оказаться не тот процесс. Явные лимиты локализуют отказ.
[limits]
web_memory = "320m"
web_cpus = "0.75"
web_pids = 128

nginx_memory = "64m"
nginx_cpus = "0.35"
nginx_pids = 64

# Размер tmpfs для временных файлов (контейнеры запускаются с read-only FS).
tmpfs_size = "32m"


# -----------------------------------------------------------------------------
# [nginx] — веб-сервер и фронтовая защита
# -----------------------------------------------------------------------------
[nginx]
worker_processes = 1          # = числу ядер VPS
worker_connections = 512

# Лимит дескрипторов на воркер. Должен быть минимум вдвое больше
# worker_connections: на каждое клиентское соединение может приходиться
# второй дескриптор на соединение с приложением. Меньшее значение
# приводит к отказам EMFILE под нагрузкой.
# Согласовано с ulimits.nofile в docker-compose.yml.
worker_rlimit_nofile = 2048

keepalive_timeout = 15

# Запросов на одно keep-alive соединение. На одном ядре переустановка
# TCP-соединения обходится дороже, чем удержание открытого, поэтому
# держим штатное значение nginx, а не заниженное.
keepalive_requests = 1000

client_max_body_size = "8m"

# Таймауты. Прямая защита от Slowloris: клиент, который тянет отправку
# заголовков или тела, отключается через N секунд.
client_body_timeout = 10
client_header_timeout = 10
send_timeout = 10
resolver_timeout = 5

# Разрешённые HTTP-методы. Всё остальное отбрасывается на уровне nginx,
# не доходя до Python.
allowed_methods = ["GET", "HEAD", "POST"]

# --- Ограничение частоты запросов (rate limiting) ---
# Общая зона: обычный просмотр каталога.
rate_limit_general = "20r/s"
rate_limit_general_burst = 40

# Строгая зона для форм входа/регистрации. Это основная защита от
# перебора паролей. Активируется на этапе 1.
rate_limit_auth = "10r/m"
rate_limit_auth_burst = 5

# Зона для админки.
rate_limit_admin = "30r/m"
rate_limit_admin_burst = 10

# Одновременных соединений с одного IP.
conn_limit_per_ip = 20

# Размер разделяемой памяти под счётчики лимитов.
# 1 MB вмещает примерно 16000 адресов.
limit_zone_size = "2m"

# Кэширование статики браузером.
static_cache_max_age = "30d"

# Логи. Отключение лога healthcheck-ов экономит место на диске:
# на 1 GB VPS переполнение диска логами — реальный сценарий отказа.
log_healthcheck = false
access_log_enabled = true


# -----------------------------------------------------------------------------
# [security] — заголовки безопасности и политика браузера
# -----------------------------------------------------------------------------
[security]
# Content-Security-Policy. Строгая по умолчанию: ни один внешний скрипт
# или стиль не выполнится, даже если попадёт в HTML через XSS.
# При подключении CDN или внешних шрифтов придётся ослабить — делайте это
# точечно, не добавляйте 'unsafe-inline' целиком.
content_security_policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

referrer_policy = "same-origin"
permissions_policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
cross_origin_opener_policy = "same-origin"
cross_origin_resource_policy = "same-origin"
x_frame_options = "DENY"

# Доверенные источники для CSRF. Django сверяет заголовок Origin/Referer.
# Заполняется автоматически из network.server_ip и [tls], но при работе
# за внешним прокси может понадобиться указать вручную.
csrf_trusted_origins = []

# Cookie. SameSite=Lax блокирует отправку cookie при кросс-сайтовых
# переходах — базовая защита от CSRF в дополнение к токену Django.
session_cookie_samesite = "Lax"
csrf_cookie_samesite = "Lax"
session_cookie_age = 1209600     # 14 суток
session_expire_at_browser_close = false

# Скрывать точную версию nginx и Django в ответах.
hide_server_version = true
